  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // `add-event-to-calendar` ships a Parcel bundle that does a bare
      // `parcelRequire = ...` assignment. Webpack (CRA) tolerated it in sloppy
      // mode; Vite emits strict-mode ESM where assigning to an undeclared global
      // throws. Predefine the global property so the assignment resolves.
      window.parcelRequire = window.parcelRequire || undefined;
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
