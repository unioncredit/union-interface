name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unit:
    name: Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
      # NOTE: `yarn lint` intentionally omitted — the eslint config is currently
      # broken (empty package.json eslintConfig + an unresolved .eslintrc.json).
      # Wire it back in once eslint is set up properly (separate task).

  integration:
    name: On-chain integration (Base fork)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      # Provides `anvil` for the forked-chain integration tests.
      - uses: foundry-rs/foundry-toolchain@v1
      - run: yarn install --frozen-lockfile
      - name: Integration tests against a Base fork
        env:
          # Optional: set an archive RPC secret for pinned-block determinism.
          FORK_RPC_URL: ${{ secrets.FORK_RPC_URL || 'https://base-rpc.publicnode.com' }}
        run: yarn test:integration
